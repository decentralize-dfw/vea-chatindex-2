<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VEA | ARCHITECTURAL VISUALIZATION ENGINE</title>
    
    <!-- Meta & SEO -->
    <meta name="description" content="VEA - Virtually Ever After. Architectural Visualization Engine. Luxembourg.">
    <meta name="robots" content="index, follow">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'telegrama': ['"Telegrama Render"', 'sans-serif'],
            },
            colors: {
              vea: {
                black: '#000000',
                white: '#ffffff',
              }
            },
            animation: {
              'pulse-custom': 'pulse-custom 2s infinite',
            },
            keyframes: {
              'pulse-custom': {
                '0%': { transform: 'scale(0.8)', opacity: '1' },
                '50%': { transform: 'scale(1.2)', opacity: '0.4' },
                '100%': { transform: 'scale(0.8)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>

    <style>
        @font-face {
            font-family: 'Telegrama Render';
            src: url('https://raw.githubusercontent.com/decentralize-dfw/font/main/vea.ttf') format('truetype');
            font-display: block;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            overflow: hidden;
            background-color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
